<style>
:root {
  --bg: #EFEAE1; --surface: #F8F5EF; --surface-2: #E5DFD4; --ink: #3B2418; --ink-2: #7D6C64; --line: #DCD3C6;
  --peri: #C9CAEE; --peri-strong: #8C8ED4; --peri-soft: #E3E3F3;
  --a1: #F3CF95; --a2: #EBA14F; --a3: #C9662A; --a4: #6E2B14; --dot: #E2DBCF;
  --warn: #9B4A1C; --warn-soft: #F5E2CC;
  --m1: #E4DCD3; --m2: #D3CCE6; --m3: #B7B8E6; --m4: #9496D9; --m5: #6567C2;
  --serif: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: .35; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--peri-strong); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 120px; }
body.flow .wrap { padding-bottom: 40px; }
body.flow nav.tabs { display: none; }
.serif { font-family: var(--serif); font-weight: 400; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.center { text-align: center; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; letter-spacing: -0.025em; margin: 0; }
h2.sec { margin: 30px 0 12px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin: 0 0 8px; text-transform: uppercase; }
.sub { color: var(--ink-2); margin: 8px 0 0; font-size: 15px; }


/* mono = all caps, everywhere */
.mono, .eyebrow, .sync, .chip, .pill, .btn, .linkbtn, .lab, label.lab, .label, .stat span, .best, .streak-top span,
.dcell .dl, .dcell .dk, .pl-meta, .last, .target b, .setchip .sn, .tlabel, .seg button, .mood span, .big-streak span,
.wd span, .wmeta, .bh, .phase-label, .bn, .legend, th, td small, .hrow span:last-child, .chart text,
nav.tabs button, .toast, .sync, .exrow .mono {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em;
}
.chart text { font-size: 9px; }

/* top */
.top { padding: 16px 0 4px; }
.brand { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; }
.logo { font-family: var(--serif); font-style: italic; font-size: 21px; text-align: center; }
.sync { font-family: var(--mono); font-size: 11px; color: var(--ink-2); background: var(--surface-2); padding: 5px 10px; border-radius: 999px; text-transform: uppercase; }
.sync.ok::before { content: "✓ "; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; padding: 0; }
.iconbtn svg { width: 19px; height: 19px; }

/* chips, pills, buttons */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); text-transform: uppercase; }
.chip.peri { background: var(--peri); }
.chip.done { background: var(--a4); color: var(--surface); }
.pills, .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { font-family: var(--mono); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 13px; min-height: 38px; text-transform: uppercase; }
.pill[aria-pressed="true"] { background: var(--peri); }
.btn { font-family: var(--mono); background: var(--peri); color: var(--ink); border-radius: 999px; padding: 11px 20px; font-size: 14px; min-height: 46px; text-transform: uppercase; }
.btn.ghost { background: transparent; }
.btn.big { width: 100%; min-height: 58px; font-size: 15px; }
.linkbtn { font-family: var(--mono); background: none; border: 0; color: var(--ink); padding: 8px 0; font-size: 13px; text-transform: uppercase; text-decoration: underline dotted; text-underline-offset: 4px; }
.cta { margin: 20px 0 6px; text-align: center; }
.cta p { margin: 10px 0 0; }
.row-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.card { background: var(--surface); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.lab, .lab { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-bottom: 5px; text-transform: uppercase; }
.inp, select.inp, textarea.inp, textarea.inp { width: 100%; min-height: 48px; background: var(--bg); border-radius: 14px; padding: 10px 14px; font-size: 17px; }
textarea.inp { min-height: 90px; resize: vertical; font-size: 16px; }
.checkrow { display: flex; gap: 10px; align-items: center; font-size: 15px; margin: 14px 0; }
.checkrow input { width: 22px; height: 22px; accent-color: var(--a4); }

/* today */
.today-hero { margin: 26px 0 18px; }
.today-hero h1 { font-size: 44px; }
.streak .streak-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.streak-num { font-family: var(--serif); font-weight: 400; font-size: 54px; line-height: .9; letter-spacing: -0.04em; margin-right: 8px; }
.streak-top span { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
.best { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dcell { display: grid; justify-items: center; gap: 6px; }
.dcell .dl { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

/* workout */

.exlist { padding: 6px 14px; }

.wk-nav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; margin-top: 18px; }

/* feeling */

.celebrate .prs { text-align: left; }

/* stats */

/* 12 weeks */

.bd { width: 15px; height: 15px; border-radius: 50%; display: inline-block; background: var(--dot); }

/* body */

/* nav */

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-family: var(--mono); font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }

ol.plan { padding: 6px 0; }
ol.plan li { padding: 14px 18px; }
.setchip { background: var(--surface-2); }
.setchip.ok { background: var(--a4); color: var(--surface); }
.setchip.cur { background: var(--peri); }
.sbtn { background: var(--surface-2); }
.card .sbtn { background: var(--bg); }

.mood { background: var(--surface); }
.mood[aria-pressed="true"] { background: var(--peri); }

/* olive replaces brown for done + charts */
:root { --a1: #DDE1C4; --a2: #B8C08A; --a3: #8A9556; --a4: #5A6930; }
/* week: contained dates */
.wday-head { grid-template-columns: 48px 1fr 28px; }
.wd { width: 48px; padding: 9px 0 8px; border-radius: 14px; background: var(--surface-2); }
.wday.is-today .wd { background: var(--peri); }
.wday.s-done .wd { background: var(--a4); color: var(--surface); }
.wday.s-done .wd span { color: color-mix(in srgb, var(--surface) 75%, transparent); }
.wday.s-rest, .wday.s-restf { background: color-mix(in srgb, var(--surface) 55%, transparent); }
/* fun green */

    <div class="setlist">${Array.from({ length: allDone && editing == null ? Math.max(ts, sets.length) : Math.max(ts, sets.length, idx + 1) }, (_, k) => {

    </div>` : `<div class="card rirq">

    </div>`}

}

// ---------- 12 weeks ----------
function renderBlock() {
  const cur = weekOf(today()), st = streaks();

  for (let d = state.settings.startDate; d <= today(); d = addDays(d, 1)) { if (defaultDay(d) !== "walk") { totalPlanned++; if (isDone(d)) totalDone++; } }
  const groups = [["Foundation", 1, 3], ["Build", 4, 7], ["Deload", 8, 8], ["Push", 9, 11], ["Deload + check-in", 12, 12]];
  let rows = "";
  groups.forEach(([name, a, b]) => {
    rows += `<div class="phase-label${cur >= a && cur <= b ? " cur" : ""}"><span>${esc(name.toLowerCase())}</span><span>${a === b ? `week ${a}` : `weeks ${a}–${b}`}</span></div>`;
    for (let n = a; n <= b; n++) {

      const dn = dates.filter(d => defaultDay(d) !== "walk" && isDone(d)).length, pl = dates.filter(d => defaultDay(d) !== "walk").length;
      const moods = dates.map(doneSession).filter(x => x && x.feeling && x.feeling.mood).map(x => x.feeling.mood);
      const avgMood = moods.length ? Math.round(moods.reduce((p, q) => p + q, 0) / moods.length) : null;
      rows += `<button class="brow${n === cur ? " cur" : ""}${n > cur ? " future" : ""}" data-wkopen="${n}" aria-label="Week ${n}, ${dn} of ${pl} workouts">

    const pts = Object.values(state.sessions).filter(x => x.ex && doneSets(x.ex[id]).length).sort((a, b) => a.date.localeCompare(b.date)).map(x => topW(doneSets(x.ex[id]))).filter(v => v != null);

  }).filter(x => x.n);

  if (!withData.find(e => e.id === ui.histEx) && withData.length) ui.histEx = withData[0].id;
  let chart = "";

    const e = EX[ui.histEx];
    const pts = Object.values(state.sessions).filter(x => x.ex && doneSets(x.ex[e.id]).length).sort((a, b) => a.date.localeCompare(b.date)).map(x => {
      const sets = doneSets(x.ex[e.id]);
      return { x: x.date, y: (e.kind === "bw" || e.kind === "time" || topW(sets) == null) ? Math.max(...sets.map(z => num(z.r))) : topW(sets) };
    });
    chart = `<div class="card">
      <label class="lab" for="histEx">exercise</label>
      <select class="inp" id="histEx">${withData.map(x => `<option value="${x.id}"${x.id === ui.histEx ? " selected" : ""}>${esc(x.n)}</option>`).join("")}</select>
      <p class="label" style="margin:14px 0 8px">${e.kind === "bw" ? "best reps" : e.kind === "time" ? "best hold (s)" : e.kind === "assist" ? "assist (lb), lower is better" : "top weight (lb)"} per session</p>
      ${lineChart(pts, null, { dots: true })}
    </div>`;
  }
  const weekly = Object.entries(state.body.weekly || {}).filter(([, v]) => num(v.weight) != null).sort((a, b) => a[0] - b[0]);
  const wFirst = weekly[0] && num(weekly[0][1].weight), wLast = weekly.length && num(weekly[weekly.length - 1][1].weight);
  return `<section class="block-hero">
      <p class="eyebrow">your 12-week block</p>
      <h1>Week ${Math.min(cur, 12)} <span class="muted">of 12</span></h1>
      <div class="progress"><span style="width:${Math.min(100, ((Math.min(cur, 12) - 1) / 12 + (Math.min(daysBetween(weekStart(Math.min(cur, 12)), today()) + 1, 7) / 84)) * 100).toFixed(1)}%"></span></div>
      <div class="stats">
        <div class="stat"><b>${totalDone}</b><span>workouts so far</span></div>
        <div class="stat"><b>${st.cur}</b><span>day streak</span></div>

      <div class="bgrid bhead"><span></span>${["M", "T", "W", "Th", "F", "S", "S"].map(l => `<span class="bh">${l}</span>`).join("")}<span class="bh">feel</span><span class="bh">done</span></div>
      ${rows}

    </div>
    ${hl.length ? `<h2 class="sec">Strength so far</h2><div class="hl">${hl.map(x => { const d = x.last - x.first; return `<div class="stat"><span>${esc(x.e.n.replace("Smith or barbell ", "").replace("Barbell ", ""))}</span><b>${x.last}<small> lb</small></b><span>${x.n > 1 ? `${d >= 0 ? "+" : ""}${d} lb since week ${weekOf(Object.values(state.sessions).filter(s2 => s2.ex && doneSets(s2.ex[x.e.id]).length).sort((a, b) => a.date.localeCompare(b.date))[0].date)}` : "first session logged"}</span></div>`; }).join("")}</div>` : ""}
    <h2 class="sec">Strength over time</h2>
    ${chart || `<div class="card empty">Finish a workout and your strength chart starts here.</div>`}
    ${weekly.length ? `<h2 class="sec">Body</h2><div class="card"><div class="wb-top"><span>Weight</span><span class="mono small muted">${weekly.length > 1 ? `${(wLast - wFirst) > 0 ? "+" : ""}${(wLast - wFirst).toFixed(1)} lb since week ${weekly[0][0]}` : `week ${weekly[0][0]}`}</span></div>${lineChart(weekly.map(([n, v]) => ({ x: v.date || weekStart(+n), y: num(v.weight) })), null, { dots: true, goal: num(state.settings.goal) })}</div>` : ""}`;
}

// ---------- Settings ----------
function renderSettings() {

      </div>
    </div>
    <p class="center" style="margin-top:28px"><button class="linkbtn" id="export">export my data</button></p>`;

function lineChart(line, dots, opts = {}) {
  const stacks = dots || (opts.dots ? line : null);
  const avg = dots ? line : null;
  const all = [...(stacks || []), ...(avg || [])];
  if (all.length === 0) return `<div class="empty">Nothing to chart yet.</div>`;
  const COLS = 30, ROWS = 12, W = 340, H = 190, L = 30, R = 8, T = 10, B = 24;
  const xs = all.map(p => parse(p.x).getTime());
  let ys = all.map(p => p.y); if (opts.goal != null) ys.push(opts.goal);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pd = Math.max(1, (y1 - y0) * 0.12); y0 -= pd; y1 += pd;
  const cw = (W - L - R) / (COLS - 1), rh = (H - T - B) / (ROWS - 1);
  const colOf = t => Math.round((t - x0) / (x1 - x0) * (COLS - 1));
  const rowOf = v => Math.round((v - y0) / (y1 - y0) * (ROWS - 1));
  const cx = c => L + c * cw, cy = r => H - B - r * rh;

  [0, Math.round((ROWS - 1) / 2), ROWS - 1].forEach(r => { const v = y0 + r / (ROWS - 1) * (y1 - y0); svg += `<text x="${L - 10}" y="${cy(r) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
  if (opts.goal != null) { const gy = cy((opts.goal - y0) / (y1 - y0) * (ROWS - 1)); svg += `<line x1="${L - 4}" x2="${W - R + 4}" y1="${gy}" y2="${gy}" stroke="var(--peri-strong)" stroke-dasharray="2 4" stroke-width="1.5" stroke-linecap="round"/><text x="${W - R}" y="${gy - 6}" text-anchor="end">goal</text>`; }
  if (stacks) {
    const byCol = {};
    stacks.forEach(p => { byCol[colOf(parse(p.x).getTime())] = p; });
    Object.entries(byCol).forEach(([c, p]) => {
      const r = rowOf(p.y), x = cx(+c);
      ["--a3", "--a2", "--a1"].forEach((v, k) => { if (r - k - 1 >= 0) svg += `<circle cx="${x}" cy="${cy(r - k - 1)}" r="2.6" fill="var(${v})"/>`; });
      svg += `<circle cx="${x}" cy="${cy(r)}" r="5.5" fill="var(--a4)" opacity=".16"/><circle cx="${x}" cy="${cy(r)}" r="3.2" fill="var(--a4)"/>`;
    });
  }
  if (avg && avg.length > 1) {
    const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);
    const d = avg.map((p, i) => `${i ? "L" : "M"}${sx(parse(p.x).getTime()).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
    svg += `<path d="${d}" fill="none" stroke="var(--peri-strong)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  svg += `<text x="${L}" y="${H - 4}">${fmtShort(ymd(new Date(x0)))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${fmtShort(ymd(new Date(x1)))}</text>`;
  return svg + `</svg>`;
}
// ---------- Photos ----------
let assetsApi; // undefined = unknown, null = unavailable
(async () => { try { assetsApi = window.claude && window.claude.use ? await claude.use("assets") : null; } catch (e) { assetsApi = null; } if (ui.view === "feeling") render(); })();
function photoSrc(ph) { return ph.data || ph.url || ("/_blob/" + ph.id); }
function shrink(file, max = 1400, q = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);

}
document.addEventListener("change", async ev => {
  if (ev.target.id !== "photoIn" || !ev.target.files[0]) return;
  ui.uploading = true; render();
  try {
    let r;
    if (assetsApi) { r = await assetsApi.upload(await shrink(ev.target.files[0])); }
    else {
      const blob = await shrink(ev.target.files[0], 900, 0.72);
      const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(blob); });
      r = { id: "local-" + Date.now(), data };
      try { localStorage.setItem("liftlog-probe", data); localStorage.removeItem("liftlog-probe"); } catch (e) { toast("Phone storage is full, photo not saved"); ui.uploading = false; render(); return; }
    }

// ---------- Timer ----------
function restFor(e) { return state.settings.restMode === "all90" ? 90 : (e.restS || 60); }
let timerInt = null;
function startRest(secs) {

  ui.timer = { end: Date.now() + secs * 1000, total: secs, done: false };
}
function tickTimer() {
  clearInterval(timerInt);
  if (!ui.timer || ui.view !== "workout") return;
  const upd = () => {
    const left = restLeft();
    const n = $("#tnum"), ring = $("#ringprog");
    if (n) n.textContent = fmtClock(left);
    if (ring) ring.style.strokeDashoffset = String(100 - (left / ui.timer.total) * 100);
    if (left <= 0 && !ui.timer.done) {
      ui.timer.done = true; clearInterval(timerInt);
      try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}

// ---------- Actions ----------

function sessKey() { return "s:" + sid(today(), curDay()); }

  return ws.length ? Math.max(...ws) : null;
}
function completeDay() {

  s.complete = true; s.updated = Date.now();
  save(sessKey(), 0);
  const prs = [];
  let volume = 0;
  if (PROGRAM[s.day]) PROGRAM[s.day].ex.forEach(e => {
    const sets = doneSets(s.ex[e.id]);

  });

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "feelNote" && ui.feel) { ui.feel.note = t.value; return; }
  if (t.id === "goal") { state.settings.goal = num(t.value); save("profile", 1000); return; }
  if (t.id === "sname") { state.settings.name = t.value.trim(); save("profile", 1000); return; }
  if (t.id === "cmin") { const s = getSession(true, today(), curDay()); s.cardio = { ...(s.cardio || {}), type: $("#ctype").value, min: num(t.value) }; save(sessKey()); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "histEx") { ui.histEx = t.value; render(); }
  if (t.id === "ctype") { const s = getSession(true, today(), curDay()); s.cardio = { ...(s.cardio || {}), type: t.value, min: num($("#cmin").value) }; save(sessKey()); }
  if (t.id === "bweek") { ui.bodyWeek = +t.value; render(); }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.tab) { ui.tab = d.tab; ui.view = null; if (d.tab === "week") { ui.viewWeek = null; ui.weekOpen = null; } if (d.tab === "body") ui.bodyWeek = null; render(); window.scrollTo(0, 0); return; }
  if (d.view) { if (d.view === "settings" && ui.view === "settings") { ui.view = null; render(); window.scrollTo(0, 0); return; } if (d.view === "feeling") ui.feel = null; ui.view = d.view; render(); window.scrollTo(0, 0); return; }
  if (d.closeview) { ui.view = null; render(); return; }
  if (d.swap) { ui.swap = !ui.swap; render(); return; }
  if (d.day) {
    const s = getSession(false, today(), curDay());
    if (state.sessions[sid(today(), curDay())] && !s.complete && setsLogged(s) === 0 && !s.cardio) delete state.sessions[sid(today(), curDay())];
    ui.day = d.day; ui.swap = false; render(); return;
  }
  // workout
  if (d.start) { const p = PROGRAM[curDay()], s = getSession(false), wk = weekOf(today()); const first = p.ex.findIndex(e => doneSets(s.ex[e.id]).length < targetSets(e, wk)); ui.wk = { i: first < 0 ? 0 : first, edit: null, list: false }; ui.view = "workout"; render(); window.scrollTo(0, 0); return; }
  if (d.openex != null) { ui.wk = { i: +d.openex, edit: null, list: false }; ui.timer = null; ui.view = "workout"; render(); window.scrollTo(0, 0); return; }
  if (d.closewk) { ui.view = null; ui.timer = null; render(); window.scrollTo(0, 0); return; }
  if (d.list) { ui.wk.list = !ui.wk.list; render(); return; }

    inp.value = String(Math.max(0, Math.round(v * 10) / 10)); return;
  }

  if (d.vibe) { state.settings.vibrate = state.settings.vibrate === false; save("profile", 0); render(); return; }
  if (d.newblock === "open") { ui.newBlock = true; render(); return; }

async function exportData() {

}
