<style>
:root {
  --bg: #EFEAE1; --surface: #F8F5EF; --surface-2: #E5DFD4; --ink: #3B2418; --ink-2: #7D6C64; --line: #DCD3C6;
  --peri: #C9CAEE; --peri-strong: #8C8ED4; --peri-soft: #E3E3F3;
  --a1: #F3CF95; --a2: #EBA14F; --a3: #C9662A; --a4: #6E2B14; --dot: #E2DBCF;
  --warn: #9B4A1C; --warn-soft: #F5E2CC;
  --m1: #E4DCD3; --m2: #D3CCE6; --m3: #B7B8E6; --m4: #9496D9; --m5: #6567C2;
  --serif: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: .35; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--peri-strong); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 120px; }
body.flow .wrap { padding-bottom: 40px; }
body.flow nav.tabs { display: none; }
.serif { font-family: var(--serif); font-weight: 400; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.center { text-align: center; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; letter-spacing: -0.025em; margin: 0; }
h2.sec { margin: 30px 0 12px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin: 0 0 8px; text-transform: uppercase; }
.sub { color: var(--ink-2); margin: 8px 0 0; font-size: 15px; }


/* mono = all caps, everywhere */
.mono, .eyebrow, .sync, .chip, .pill, .btn, .linkbtn, .lab, label.lab, .label, .stat span, .best, .streak-top span,
.dcell .dl, .dcell .dk, .pl-meta, .last, .target b, .setchip .sn, .tlabel, .seg button, .mood span, .big-streak span,
.wd span, .wmeta, .bh, .phase-label, .bn, .legend, th, td small, .hrow span:last-child, .chart text,
nav.tabs button, .toast, .sync, .exrow .mono {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em;
}
.chart text { font-size: 9px; }

/* top */
.top { padding: 16px 0 4px; }
.brand { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; }
.logo { font-family: var(--serif); font-style: italic; font-size: 21px; text-align: center; }
.sync { font-family: var(--mono); font-size: 11px; color: var(--ink-2); background: var(--surface-2); padding: 5px 10px; border-radius: 999px; text-transform: uppercase; }
.sync.ok::before { content: "✓ "; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; padding: 0; }
.iconbtn svg { width: 19px; height: 19px; }

/* chips, pills, buttons */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); text-transform: uppercase; }
.chip.peri { background: var(--peri); }
.chip.done { background: var(--a4); color: var(--surface); }

/* today v3 */
.today-hero { margin: 40px 0 24px; }
.today-hero h1 { font-size: 44px; }
.streak { padding: 18px; }
.streak .streak-top { margin: 0; align-items: center; }
.journey { padding: 20px 18px; }
.j-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.jbar i.past { background: var(--a2); }
.jbar i.now { background: var(--a4); }

/* olive replaces brown for done + charts */
:root { --a1: #DDE1C4; --a2: #B8C08A; --a3: #8A9556; --a4: #5A6930; }

.done-card .btn.ghost { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); }
.xd.cur.done { background: var(--a4); box-shadow: inset 0 0 0 2px var(--ink); }
.progress span { background: linear-gradient(90deg, var(--a2), var(--a4)); }

.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.lightbox { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }

.pl-row { border-radius: 0; padding: 16px 18px; }
/* workout progress: current = purple, no ring */

.toggle[aria-pressed="true"] i { background: var(--a4); }
.toggle[aria-pressed="true"] i::after { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .toggle i, .toggle i::after { transition: none; } }
.blockcard { margin: 0; }
.bc-line { margin: 0; font-family: var(--serif); font-size: 24px; letter-spacing: -0.02em; }
.bc-line b { font-weight: 400; }
.nb { margin-top: 16px; }
.goal-row { margin-top: 30px; }
.goal-in { position: relative; }
.goal-in span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
/* weight cue */
.stp-lab { display: flex; justify-content: space-between; align-items: center; }
.cue { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); color: var(--ink); padding: 3px 9px; border-radius: 999px; }
.cue.up { background: var(--a4); }

.brand .iconbtn { width: 40px; height: 40px; justify-content: start; justify-items: start; padding: 0; background: none; }
.brand .iconbtn:hover, .iconbtn:hover { background: none; }
.brand .iconbtn svg { width: 22px; height: 22px; }
button.logo { background: none; border: 0; padding: 0; color: inherit; justify-self: center; }
/* streak banner */
.today-hero { margin: 40px 0 18px; }
.streak-banner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; background: var(--surface); border-radius: 22px; padding: 12px 18px 12px 20px; }
.streak-banner.on { background: var(--a4); }
.streak-banner .streak-num { font-size: 52px; line-height: 1; margin: 0; letter-spacing: -0.05em; }
.sb-text { display: grid; gap: 2px; min-width: 0; }
.sb-label { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.sb-sub { font-size: 14px; color: color-mix(in srgb, var(--ink) 70%, transparent); }
.sb-ticks { display: grid; grid-template-columns: repeat(7, 7px); gap: 4px; }
.sb-ticks i { width: 7px; height: 18px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 12%, transparent); }
.streak-banner.on .sb-ticks i { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.streak-banner.on .sb-ticks i.on { background: var(--ink); }
.plan-head { margin-top: 36px; }
.wk-strip { padding: 16px 12px; margin-bottom: 14px; }
.streak-banner { grid-template-columns: auto 1fr; align-items: center; margin-bottom: 10px; }
.streak-banner .streak-num { display: block; }
.sb-text { align-self: center; }
.journey { padding: 16px 12px; }
/* streak: optically centered */
.streak-banner { display: flex; align-items: center; gap: 16px; padding: 20px 22px; }
.streak-banner .streak-num { font-size: 50px; line-height: 1; }
.sb-text { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
@supports (text-box: trim-both cap alphabetic) {
  .streak-banner .streak-num, .sb-label, .sb-sub { text-box: trim-both cap alphabetic; }
  .sb-text { gap: 10px; }
}
@supports not (text-box: trim-both cap alphabetic) {
  .streak-banner .streak-num { transform: translateY(-0.07em); margin-bottom: -0.14em; }
}
.wday { padding: 10px 18px 10px 10px; }
.big-streak b { font-size: 92px; line-height: 1; }
.big-streak span { margin-top: 18px; }
.sync { display: none; }
.brand { display: flex; justify-content: space-between; align-items: center; }
button.logo { order: 0; justify-self: auto; text-align: left; line-height: 1; }
.brand .iconbtn { order: 1; justify-content: end; justify-items: end; place-items: center end; }
</style>

<script>
const PROGRAM = {
  upper1: { title: "Upper body + core", ex: [
    { id: "pulldown", restS: 90, n: "Lat pulldown", s: 3, lo: 8, hi: 12, rest: "90 s", inc: 5, main: true, note: "Pull elbows to ribs." },

    { id: "cablerow", restS: 90, n: "Seated cable row", s: 3, lo: 10, hi: 12, rest: "90 s", inc: 5, note: "Pause 1 second at the squeeze." },
    { id: "lateral", restS: 60, n: "Dumbbell lateral raise", s: 3, lo: 12, hi: 15, rest: "60 s", inc: 2.5, iso: true, note: "Shapes the shoulders so arms look leaner." },
    { id: "pushdown", restS: 60, n: "Cable triceps pushdown", s: 3, lo: 12, hi: 15, rest: "60 s", inc: 5, iso: true, note: "Back of the arm." },
    { id: "deadbug", restS: 45, n: "Dead bug", s: 3, lo: 8, hi: 8, rest: "45 s", kind: "bw", side: true, note: "Low back pressed into the floor." },
    { id: "pallof", restS: 45, n: "Pallof press", s: 3, lo: 10, hi: 10, rest: "45 s", inc: 5, iso: true, side: true, note: "Resist the twist." }
  ]},
  glutes1: { title: "Glutes & hamstrings", ex: [
    { id: "hipthrust", restS: 150, n: "Barbell hip thrust", s: 4, lo: 8, hi: 12, rest: "2–3 min", inc: 10, main: true, pushAdd: true, note: "Chin tucked, 1-second squeeze at the top." },
    { id: "rdl", restS: 120, n: "Romanian deadlift", s: 3, lo: 8, hi: 12, rest: "2 min", inc: 5, main: true, note: "Hips back, soft knees, feel the hamstring stretch." },
    { id: "bss", restS: 90, n: "Bulgarian split squat", s: 3, lo: 8, hi: 12, rest: "90 s", inc: 5, side: true, note: "Lean your torso forward to keep it on the glutes." },
    { id: "hamcurl", restS: 75, n: "Hamstring curl", s: 3, lo: 10, hi: 15, rest: "60–90 s", inc: 5, iso: true, note: "Slow on the way down." },
    { id: "backext", restS: 60, n: "45° back extension", s: 3, lo: 12, hi: 20, rest: "60 s", inc: 5, iso: true, note: "Toes out, round your upper back, squeeze glutes to rise." },
    { id: "abduction", restS: 60, n: "Hip abduction machine", s: 3, lo: 15, hi: 20, rest: "60 s", inc: 5, iso: true, note: "Lean forward for upper glutes." }

  upper2: { title: "Upper body + arms", ex: [
    { id: "pullup", restS: 120, n: "Assisted pull-up", s: 3, lo: 6, hi: 10, rest: "2 min", inc: 5, kind: "assist", main: true, note: "Log the assistance weight. Less assistance is progress." },
    { id: "ohp", restS: 90, n: "Seated dumbbell shoulder press", s: 3, lo: 8, hi: 12, rest: "90 s", inc: 5, main: true },
    { id: "dbrow", restS: 75, n: "One-arm dumbbell row", s: 3, lo: 10, hi: 12, rest: "60–90 s", inc: 5, side: true },
    { id: "chestpress", restS: 90, n: "Machine chest press", s: 3, lo: 10, hi: 15, rest: "90 s", inc: 5, note: "Or push-ups with hands elevated." },
    { id: "facepull", restS: 60, n: "Face pull", s: 3, lo: 12, hi: 20, rest: "60 s", inc: 5, iso: true, note: "Posture and shoulder shape." },
    { id: "curl", restS: 30, n: "Dumbbell curl", s: 3, lo: 12, hi: 15, rest: "Superset", inc: 2.5, iso: true, note: "Superset with the triceps extension." },
    { id: "ohtri", restS: 60, n: "Overhead triceps extension", s: 3, lo: 12, hi: 15, rest: "60 s", inc: 2.5, iso: true, note: "Rest after both moves." },
    { id: "cablecrunch", restS: 45, n: "Cable crunch", s: 3, lo: 12, hi: 15, rest: "45 s", inc: 5, iso: true },
    { id: "sideplank", restS: 30, n: "Side plank", s: 3, lo: 30, hi: 30, rest: "30 s", kind: "time", side: true }
  ]},
  glutes2: { title: "Glutes & hips", ex: [
    { id: "bridge", restS: 120, n: "Smith or barbell glute bridge", s: 4, lo: 10, hi: 15, rest: "2 min", inc: 10, main: true, pushAdd: true, note: "Shorter range than a thrust. Heavy squeeze." },
    { id: "revlunge", restS: 90, n: "Deficit reverse lunge", s: 3, lo: 8, hi: 12, rest: "90 s", inc: 5, side: true, note: "Stand on a 2–4 in step, step back, lean forward." },
    { id: "slrdl", restS: 90, n: "B-stance RDL", s: 3, lo: 10, hi: 12, rest: "90 s", inc: 5, side: true, note: "Hold a rack for balance if you need it." },
    { id: "kickback", restS: 60, n: "Cable kickback", s: 3, lo: 12, hi: 15, rest: "60 s", inc: 2.5, iso: true, side: true, note: "Kick back and slightly out." },
    { id: "abduction2", restS: 60, n: "Cable or machine hip abduction", s: 3, lo: 15, hi: 25, rest: "60 s", inc: 5, iso: true },

  ]}
};
const DAYS = [
  { key: "upper1", label: "Upper A", short: "upper", dow: [1], kind: "lift", focus: "Back, chest, shoulders, triceps and core" },
  { key: "glutes1", label: "Glutes A", short: "glutes", dow: [2], kind: "lift", focus: "Hip thrusts, RDLs and hamstrings" },
  { key: "cardio", label: "Cardio", short: "cardio", dow: [3], kind: "cardio", focus: "30–45 min incline walk or row, conversational pace" },
  { key: "upper2", label: "Upper B", short: "upper", dow: [4], kind: "lift", focus: "Back, shoulders, arms and core" },
  { key: "glutes2", label: "Glutes B", short: "glutes", dow: [5], kind: "lift", focus: "Glute bridges, lunges, kickbacks and abduction" },
  { key: "walk", label: "Walk or rest", short: "rest", dow: [6, 0], kind: "walk", focus: "Walk, hike or rest. Rest days never break your streak." }
];
const ALL_EX = Object.entries(PROGRAM).flatMap(([d, p]) => p.ex.map(e => ({ ...e, day: d })));
const EX = Object.fromEntries(ALL_EX.map(e => [e.id, e]));
const PHASES = [
  { weeks: "1–3", name: "Foundation", rir: "RIR 3", change: "Learn form, 3-second lowering on main lifts, find starting weights. One fewer set on main lifts in week 1." },
  { weeks: "4–7", name: "Build", rir: "RIR 1–2", change: "Full sets as written. Beat last time every session." },
  { weeks: "8", name: "Deload", rir: "RIR 4", change: "Same exercises, half the sets, about 15% lighter." },
  { weeks: "9–11", name: "Push", rir: "RIR 0–2", change: "One extra set on hip thrusts and glute bridges. Last isolation set close to failure." },
  { weeks: "12", name: "Deload + check-in", rir: "RIR 4", change: "Deload like week 8, then photos and measurements." }
];
function phase(w) {
  if (w <= 3) return { name: "Foundation", rir: "RIR 3", tip: w === 1 ? "Learn the form and find your weights. One fewer set on main lifts this week." : "Lower for 3 seconds on main lifts. Stop with about 3 reps left." };

  if (w === 8) return { name: "Deload", rir: "RIR 4", deload: true, tip: "Half the sets, about 15% lighter. Recovery is the point." };
  if (w <= 11) return { name: "Push", rir: "RIR 0–2", push: true, tip: "Extra set on thrusts and bridges. Take the last isolation set close to failure." };

}
// ---------- Utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const addDays = (str, n) => { const d = parse(str); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = s => parse(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const fmtShort = s => parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });

  }
  if (!s.complete) html += `<div class="swap"><button class="linkbtn" data-swap="1">${ui.swap ? "Keep today’s workout" : "Doing a different workout today?"}</button>
      ${ui.swap ? `<div class="pills">${DAYS.map(d => `<button class="pill" data-day="${d.key}" aria-pressed="${d.key === dayKey}">${d.label}</button>`).join("")}</div>` : ""}</div>`;
  return html;
}

// ---------- Workout mode ----------
function restLeft() { return ui.timer ? Math.max(0, Math.ceil((ui.timer.end - Date.now()) / 1000)) : 0; }
function fmtClock(s) { return `${Math.floor(s / 60)}:${pad(s % 60)}`; }
function renderWorkout() {
  const t = today(), week = weekOf(t), dayKey = curDay(), p = PROGRAM[dayKey];
  const s = getSession(false, t, dayKey);
  const i = Math.min(ui.wk.i, p.ex.length - 1), e = p.ex[i];
  const entry = s.ex[e.id] || { sets: [], rir: null };
  const sets = entry.sets || [];
  const ts = targetSets(e, week);
  const logged = sets.filter(x => x && num(x.r) > 0).length;
  const sg = suggest(e, s);
  const prevTop = (() => { const hh = exHistory(e.id, sid(s.date, s.day)); return hh[0] ? topW(hh[0].sets) : null; })();
  const cue = e.kind === "bw" || e.kind === "time" ? "" : prevTop == null ? "find your weight"
    : phase(week).deload ? "deload, go lighter"
    : sg.up && sg.w != null ? (e.kind === "assist" ? `−${prevTop - sg.w} lb assist today` : `+${sg.w - prevTop} lb today`)
    : sg.warn && /^Stuck/.test(sg.text) ? "reset 10% lighter"
    : "";
  const h = exHistory(e.id, sid(t, dayKey));
  const editing = ui.wk.edit;
  const idx = editing != null ? editing : logged;
  const cur = sets[idx] || {};
  const prevSet = sets[idx - 1] || {};
  const lastSame = h[0] && h[0].sets[idx];
  const wVal = cur.w ?? prevSet.w ?? sg.w ?? (lastSame ? num(lastSame.w) : "") ?? "";
  const rVal = cur.r ?? (lastSame ? num(lastSame.r) : e.lo);
  const noW = e.kind === "bw" || e.kind === "time";
  const repUnit = e.kind === "time" ? "sec" : "reps";
  const allDone = logged >= ts;
  const timer = ui.timer && restLeft() > 0 ? `<div class="timer" id="timer">
      <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="prog" id="ringprog" pathLength="100"/></svg>
      <div class="tcenter"><span class="tlabel">rest</span><b id="tnum">${fmtClock(restLeft())}</b></div>
      <div class="tbtns"><button class="pill" data-addrest="1">+15 s</button><button class="pill" data-skiprest="1">skip rest</button></div>
    </div>` : ui.timer && ui.timer.done ? `<div class="timer-done">Rest’s up. Next set when you’re ready.</div>` : "";
  const exDots = p.ex.map((x, k) => { const d = doneSets(s.ex[x.id]).length, tt = targetSets(x, week); return `<button class="xd${k === i ? " cur" : ""}${d >= tt ? " done" : d ? " part" : ""}" data-goex="${k}" aria-label="${esc(x.n)}"></button>`; }).join("");
  return `<div class="wk-top">
      <button class="iconbtn" data-closewk="1" aria-label="Close workout">✕</button>
      <span class="mono small">exercise ${i + 1} of ${p.ex.length}</span>
      <button class="iconbtn" data-list="1" aria-label="All exercises">☰</button>
    </div>
    <div class="xdots">${exDots}</div>
    ${ui.wk.list ? `<div class="card exlist">${p.ex.map((x, k) => { const d = doneSets(s.ex[x.id]).length, tt = targetSets(x, week); return `<button class="exrow" data-goex="${k}"><span>${esc(x.n)}</span><span class="mono small muted">${d}/${tt}</span></button>`; }).join("")}</div>` : ""}
    <h1 class="wk-name">${esc(e.n)}</h1>
    <p class="sub">${ts} sets of ${e.lo === e.hi ? e.lo : e.lo + "–" + e.hi}${e.kind === "time" ? " s" : ""}${e.side ? " per side" : ""}, rest ${fmtClock(restFor(e))}</p>
    ${h[0] ? `<p class="last">${esc(lastString(e, h[0]))}</p>` : ""}
    <div class="setlist">${Array.from({ length: allDone && editing == null ? Math.max(ts, sets.length) : Math.max(ts, sets.length, idx + 1) }, (_, k) => {
      const x = sets[k]; const ok = x && num(x.r) > 0;
      const label = ok ? `${noW ? "" : `${num(x.w) ?? "–"} lb × `}${num(x.r)}${e.kind === "time" ? " s" : ""}` : k === idx ? "now" : "–";
      return `<button class="setchip${ok ? " ok" : ""}${k === idx ? " cur" : ""}" ${ok ? `data-editset="${k}"` : ""}><span class="sn">set ${k + 1}</span><span class="sv">${label}</span></button>`;
    }).join("")}</div>
    ${timer}
    ${!allDone || editing != null ? `<div class="logger card">
      ${noW ? "" : `<div class="stepper"><span class="lab stp-lab"><span>${e.kind === "assist" ? "assist (lb)" : "weight (lb)"}</span>${cue ? `<span class="cue${sg.up ? " up" : ""}">${esc(cue)}</span>` : ""}</span><div class="stp"><button class="sbtn" data-step="w" data-d="-${e.inc || 5}" aria-label="Less weight">−</button><input id="inW" inputmode="decimal" value="${esc(wVal)}" placeholder="0"><button class="sbtn" data-step="w" data-d="${e.inc || 5}" aria-label="More weight">+</button></div></div>`}
      <div class="stepper"><span class="lab">${repUnit}${e.side ? " per side" : ""}</span><div class="stp"><button class="sbtn" data-step="r" data-d="${e.kind === "time" ? -5 : -1}" aria-label="Fewer">−</button><input id="inR" inputmode="numeric" value="${esc(rVal)}"><button class="sbtn" data-step="r" data-d="${e.kind === "time" ? 5 : 1}" aria-label="More">+</button></div></div>
      <button class="btn big" id="logSet">${editing != null ? `update set ${idx + 1}` : `log set ${idx + 1}`}</button>
      ${editing != null ? `<div class="row-actions"><button class="linkbtn" data-canceledit="1">cancel</button><button class="linkbtn" data-removeset="${idx}">remove set</button></div>` : ""}
    </div>` : `<div class="card rirq">
      <p class="q">Reps left in the tank on your last set?</p>
      <div class="seg wide">${[0, 1, 2, 3, 4].map(n => `<button data-rir="${n}" aria-pressed="${entry.rir === n}">${n === 4 ? "4+" : n}</button>`).join("")}</div>
      <p class="small muted">This tells the app when to add weight next time.</p>
      <button class="linkbtn" data-addset="1">add another set</button>
    </div>`}
    <div class="wk-nav">
      <button class="btn ghost" data-goex="${i - 1}" ${i === 0 ? "disabled" : ""}>‹ back</button>
      ${i < p.ex.length - 1 ? `<button class="btn${allDone ? "" : " ghost"}" data-goex="${i + 1}">next exercise ›</button>` : `<button class="btn" data-finishwk="1">finish workout</button>`}
    </div>`;
}

// ---------- Feeling ----------
function renderFeeling() {
  const s = getSession(true, today(), curDay());
  const f = ui.feel || (ui.feel = { mood: s.feeling?.mood ?? null, tags: [...(s.feeling?.tags || [])], note: s.feeling?.note || "", photo: s.photo || null });
  return `<div class="wk-top"><button class="iconbtn" data-backfeel="1" aria-label="Back">‹</button><span class="mono small">check-in</span><span style="width:40px"></span></div>
    <h1 class="feel-h">How do you feel?</h1>
    <div class="moods">${MOODS.map(m => `<button class="mood m${m.v}" data-mood="${m.v}" aria-pressed="${f.mood === m.v}"><i></i><span>${m.w}</span></button>`).join("")}</div>
    <h2 class="sec">Anything stand out?</h2>
    <div class="tags">${TAGS.map(t => `<button class="pill" data-tag="${t}" aria-pressed="${f.tags.includes(t)}">${t}</button>`).join("")}</div>
    <h2 class="sec">Note to future you</h2>
    <textarea class="inp" id="feelNote" placeholder="What felt good, what to remember next time">${esc(f.note)}</textarea>
    <div class="cta"><button class="btn big" id="saveFeel" ${f.mood == null ? "disabled" : ""}>${s.complete ? "save check-in" : "complete the day"}</button>${f.mood == null ? `<p class="small muted">Pick how you feel to finish.</p>` : ""}</div>`;
}

// ---------- Celebrate ----------
function renderCelebrate() {
  const c = ui.celebrate || {}, s = getSession(false, today(), curDay()), week = weekOf(today());
  return `<section class="celebrate">
      <p class="eyebrow">${esc(fmtLong(today()).toLowerCase())}</p>
      <h1>Day complete.</h1>
      <div class="big-streak"><b class="streak-num pop">${c.streak}</b><span>day streak${c.streak > 1 && c.streak === c.best ? ", your best yet" : ""}</span></div>
      ${weekStrip(week)}
      <div class="stats">
        ${PROGRAM[s.day] ? `<div class="stat"><b>${setsLogged(s)}</b><span>sets</span></div><div class="stat"><b>${c.volume >= 1000 ? (c.volume / 1000).toFixed(1) + "k" : c.volume}</b><span>lb lifted</span></div>` : `<div class="stat"><b>${s.cardio?.min || "–"}</b><span>minutes</span></div>`}
        <div class="stat"><b>${esc(moodWord(s.feeling?.mood))}</b><span>feeling</span></div>
      </div>
      ${c.prs && c.prs.length ? `<div class="card prs"><p class="eyebrow">new personal bests</p>${c.prs.map(p => `<div class="hrow"><span>${esc(p.n)}</span><span>${p.w} lb</span></div>`).join("")}</div>` : ""}
      <button class="btn big" data-closecele="1">done</button>
    </section>`;
}

// ---------- Week ----------
function renderWeek() {
  const cur = weekOf(today()), n = Math.max(1, ui.viewWeek ?? cur), ph = phase(n), ws = weekStart(n);
  const dates = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const planned = dates.filter(d => defaultDay(d) !== "walk").length, done = dates.filter(d => defaultDay(d) !== "walk" && isDone(d)).length;
  const cards = dates.map((d, i) => {
    const st = dayStatus(d), k = st.day, day = DAYS.find(x => x.key === k), sess = doneSession(d);
    const open = ui.weekOpen === d;
    const exs = PROGRAM[k] ? PROGRAM[k].ex : null;
    return `<article class="wday ${st.cls}${st.isToday ? " is-today" : ""}">
      <button class="wday-head" data-wopen="${d}" aria-expanded="${open}">
        <span class="wd"><b>${LETTERS[parse(d).getDay()]}</b><span>${parse(d).toLocaleDateString(undefined, { month: "short" })} ${parse(d).getDate()}</span></span>
        <span class="wmain"><span class="wtitle">${esc(dayTitle(k))}</span><span class="wsum">${esc(day.focus)}</span>
          <span class="wmeta icons">${exs ? `<span>${ICON.lift}${plural(exs.length, "exercise")}</span><span>${ICON.clock}About ${estMinutes(k, n)} min</span>` : k === "cardio" ? `<span>${ICON.clock}30–45 min</span>` : `<span>${ICON.clock}Optional</span>`}${sess && sess.feeling ? `<span class="feel m${sess.feeling.mood}">${ICON.feel}Felt ${esc(moodWord(sess.feeling.mood))}</span>` : ""}</span></span>
        <span class="wstat" aria-hidden="true">${st.done ? "✓" : st.isToday ? "•" : ""}</span>
      </button>
      ${open && exs ? `<ol class="plan mini">${exs.map(e => `<li><div class="pl-main"><span class="pl-name">${esc(e.n)}</span><span class="pl-meta">${targetSets(e, n)} × ${e.lo === e.hi ? e.lo : e.lo + "–" + e.hi}${e.kind === "time" ? " s" : ""}${e.side ? " per side" : ""}</span></div></li>`).join("")}</ol>` : ""}
    </article>`;
  }).join("");
  return `<div class="weeknav">
      <button class="round" data-wk="${n - 1}" ${n <= 1 ? "disabled" : ""} aria-label="Previous week">‹</button>
      <h1>Week ${n}</h1>
      <button class="round" data-wk="${n + 1}" aria-label="Next week">›</button>
    </div>
    <div class="week-meta">
      <div class="meta-line"><span>${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}</span><span>${esc(ph.name)}, ${esc(ph.rir)}</span><span><b>${done}/${planned}</b> done</span></div>
      <p class="week-tip">${esc(ph.tip)}</p>
      ${n !== cur ? `<button class="linkbtn" data-wk="${cur}">Back to this week</button>` : ""}
    </div>
    ${cards}`;
}

// ---------- 12 weeks ----------
function renderBlock() {
  const cur = weekOf(today()), st = streaks();
  let totalDone = 0, totalPlanned = 0;
  for (let d = state.settings.startDate; d <= today(); d = addDays(d, 1)) { if (defaultDay(d) !== "walk") { totalPlanned++; if (isDone(d)) totalDone++; } }
  const groups = [["Foundation", 1, 3], ["Build", 4, 7], ["Deload", 8, 8], ["Push", 9, 11], ["Deload + check-in", 12, 12]];
  let rows = "";
  groups.forEach(([name, a, b]) => {
    rows += `<div class="phase-label${cur >= a && cur <= b ? " cur" : ""}"><span>${esc(name.toLowerCase())}</span><span>${a === b ? `week ${a}` : `weeks ${a}–${b}`}</span></div>`;
    for (let n = a; n <= b; n++) {
      const ws = weekStart(n), dates = Array.from({ length: 7 }, (_, i) => addDays(ws, i)), ph = phase(n);
      const dn = dates.filter(d => defaultDay(d) !== "walk" && isDone(d)).length, pl = dates.filter(d => defaultDay(d) !== "walk").length;
      const moods = dates.map(doneSession).filter(x => x && x.feeling && x.feeling.mood).map(x => x.feeling.mood);
      const avgMood = moods.length ? Math.round(moods.reduce((p, q) => p + q, 0) / moods.length) : null;
      rows += `<button class="brow${n === cur ? " cur" : ""}${n > cur ? " future" : ""}" data-wkopen="${n}" aria-label="Week ${n}, ${dn} of ${pl} workouts">
        <span class="bl">${n}</span>
        ${dates.map(d => { const s2 = dayStatus(d); return `<span class="bd ${s2.cls}${s2.isToday ? " is-today" : ""}${ph.deload ? " dl" : ""}"></span>`; }).join("")}
        <span class="bmood">${avgMood ? `<i class="m${avgMood}" title="felt ${moodWord(avgMood)}"></i>` : ""}</span>
        <span class="bn">${n <= cur ? `${dn}/${pl}` : ""}</span>
      </button>`;
    }
  });
  // strength highlights
  const keyLifts = ["hipthrust", "bridge", "rdl", "pulldown"];
  const hl = keyLifts.map(id => {
    const pts = Object.values(state.sessions).filter(x => x.ex && doneSets(x.ex[id]).length).sort((a, b) => a.date.localeCompare(b.date)).map(x => topW(doneSets(x.ex[id]))).filter(v => v != null);
    return { e: EX[id], first: pts[0], last: pts[pts.length - 1], n: pts.length };
  }).filter(x => x.n);
  const withData = ALL_EX.filter(e => Object.values(state.sessions).some(x => x.ex && doneSets(x.ex[e.id]).length));
  if (!withData.find(e => e.id === ui.histEx) && withData.length) ui.histEx = withData[0].id;
  let chart = "";
  if (withData.length) {
    const e = EX[ui.histEx];
    const pts = Object.values(state.sessions).filter(x => x.ex && doneSets(x.ex[e.id]).length).sort((a, b) => a.date.localeCompare(b.date)).map(x => {
      const sets = doneSets(x.ex[e.id]);
      return { x: x.date, y: (e.kind === "bw" || e.kind === "time" || topW(sets) == null) ? Math.max(...sets.map(z => num(z.r))) : topW(sets) };
    });
    chart = `<div class="card">
      <label class="lab" for="histEx">exercise</label>
      <select class="inp" id="histEx">${withData.map(x => `<option value="${x.id}"${x.id === ui.histEx ? " selected" : ""}>${esc(x.n)}</option>`).join("")}</select>
      <p class="label" style="margin:14px 0 8px">${e.kind === "bw" ? "best reps" : e.kind === "time" ? "best hold (s)" : e.kind === "assist" ? "assist (lb), lower is better" : "top weight (lb)"} per session</p>
      ${lineChart(pts, null, { dots: true })}
    </div>`;
  }
  const weekly = Object.entries(state.body.weekly || {}).filter(([, v]) => num(v.weight) != null).sort((a, b) => a[0] - b[0]);
  const wFirst = weekly[0] && num(weekly[0][1].weight), wLast = weekly.length && num(weekly[weekly.length - 1][1].weight);
  return `<section class="block-hero">
      <p class="eyebrow">your 12-week block</p>
      <h1>Week ${Math.min(cur, 12)} <span class="muted">of 12</span></h1>
      <div class="progress"><span style="width:${Math.min(100, ((Math.min(cur, 12) - 1) / 12 + (Math.min(daysBetween(weekStart(Math.min(cur, 12)), today()) + 1, 7) / 84)) * 100).toFixed(1)}%"></span></div>
      <div class="stats">
        <div class="stat"><b>${totalDone}</b><span>workouts so far</span></div>
        <div class="stat"><b>${st.cur}</b><span>day streak</span></div>
        <div class="stat"><b>${st.best}</b><span>best streak</span></div>
      </div>
    </section>
    <div class="card bcard">
      <div class="bgrid bhead"><span></span>${["M", "T", "W", "Th", "F", "S", "S"].map(l => `<span class="bh">${l}</span>`).join("")}<span class="bh">feel</span><span class="bh">done</span></div>
      ${rows}
      <div class="legend"><span><i class="bd s-done"></i>done</span><span><i class="bd s-missed"></i>missed</span><span><i class="bd s-future dl"></i>deload</span><span><i class="lm m4"></i>avg feeling</span></div>
    </div>
    ${hl.length ? `<h2 class="sec">Strength so far</h2><div class="hl">${hl.map(x => { const d = x.last - x.first; return `<div class="stat"><span>${esc(x.e.n.replace("Smith or barbell ", "").replace("Barbell ", ""))}</span><b>${x.last}<small> lb</small></b><span>${x.n > 1 ? `${d >= 0 ? "+" : ""}${d} lb since week ${weekOf(Object.values(state.sessions).filter(s2 => s2.ex && doneSets(s2.ex[x.e.id]).length).sort((a, b) => a.date.localeCompare(b.date))[0].date)}` : "first session logged"}</span></div>`; }).join("")}</div>` : ""}
    <h2 class="sec">Strength over time</h2>
    ${chart || `<div class="card empty">Finish a workout and your strength chart starts here.</div>`}
    ${weekly.length ? `<h2 class="sec">Body</h2><div class="card"><div class="wb-top"><span>Weight</span><span class="mono small muted">${weekly.length > 1 ? `${(wLast - wFirst) > 0 ? "+" : ""}${(wLast - wFirst).toFixed(1)} lb since week ${weekly[0][0]}` : `week ${weekly[0][0]}`}</span></div>${lineChart(weekly.map(([n, v]) => ({ x: v.date || weekStart(+n), y: num(v.weight) })), null, { dots: true, goal: num(state.settings.goal) })}</div>` : ""}`;
}

// ---------- Body (weekly) ----------
function renderBody() {
  const cur = weekOf(today()), n = ui.bodyWeek ?? cur, W = state.body.weekly || {};
  const entry = W[n] || {};
  const list = Object.entries(W).sort((a, b) => b[0] - a[0]);
  const first = Object.entries(W).sort((a, b) => a[0] - b[0])[0];
  const f0 = first && first[1];
  const delta = (k, v) => { if (!f0 || num(f0[k]) == null || num(v) == null || list.length < 2) return ""; const x = num(v) - num(f0[k]); return `<small class="${x <= 0 ? "dn" : "up"}">${x > 0 ? "+" : ""}${x.toFixed(1)}</small>`; };
  const due = [4, 8, 12].includes(n);
  const weeks = Array.from({ length: Math.max(12, cur) }, (_, i) => i + 1);
  return `<section class="block-hero"><p class="eyebrow">Week ${n}, before breakfast</p><h1>Weekly check-in</h1></section>
    <div class="card">
      <div class="wb-top"><label class="lab" for="bweek" style="margin:0">week</label>${W[n] ? `<span class="chip done">✓ logged</span>` : n === cur ? `<span class="chip peri">due this week</span>` : ""}</div>
      <select class="inp" id="bweek">${weeks.map(w => `<option value="${w}"${w === n ? " selected" : ""}>Week ${w}, ${fmtShort(weekStart(w))}${W[w] ? " ✓" : ""}</option>`).join("")}</select>
      <div class="grid2" style="margin-top:12px">
        <div><label class="lab" for="bw">weight (lb)</label><input class="inp" id="bw" inputmode="decimal" value="${esc(entry.weight ?? "")}"></div>
        <div><label class="lab" for="cwaist">waist (in)</label><input class="inp" id="cwaist" inputmode="decimal" value="${esc(entry.waist ?? "")}"></div>
        <div><label class="lab" for="chips">hips, widest (in)</label><input class="inp" id="chips" inputmode="decimal" value="${esc(entry.hips ?? "")}"></div>
        <div><label class="lab" for="carm">upper arm (in)</label><input class="inp" id="carm" inputmode="decimal" value="${esc(entry.arm ?? "")}"></div>
      </div>
      <div class="wph">
        <span class="lab">progress photo${due ? ", photo week" : ""}</span>
        ${entry.photo ? `<div class="ph-prev"><img src="${esc(photoSrc(entry.photo))}" alt="Week ${n} photo"><button class="pill" data-rmwphoto="1">remove</button></div>`
          : false ? ""
          : `<label class="ph-add${ui.uploading ? " busy" : ""}"><input type="file" accept="image/*" id="photoIn" hidden ${ui.uploading ? "disabled" : ""}><span>${ui.uploading ? "Uploading…" : "Add this week’s photo"}</span></label>`}
      </div>
      <button class="btn big" id="saveWeek">${W[n] ? "update check-in" : "save check-in"}</button>
    </div>
    ${photoGallery()}
    <div class="set-group goal-row"><label class="lab" for="goal">goal weight (optional)</label><div class="goal-in"><input class="inp" id="goal" inputmode="decimal" value="${esc(state.settings.goal ?? "")}" placeholder="Shows as a line on your weight chart"><span>lb</span></div></div>
    ${list.length ? `<h2 class="sec">History</h2><div class="card tablewrap"><table><thead><tr><th>week</th><th>weight</th><th>waist</th><th>hips</th><th>arm</th></tr></thead><tbody>
      ${list.map(([w, c]) => `<tr><td><b class="serif">${w}</b></td><td>${c.weight ?? "–"}${delta("weight", c.weight)}</td><td>${c.waist ?? "–"}${delta("waist", c.waist)}</td><td>${c.hips ?? "–"}${delta("hips", c.hips)}</td><td>${c.arm ?? "–"}${delta("arm", c.arm)}</td></tr>`).join("")}
    </tbody></table></div>` : ""}`;
}

function photoGallery() {
  const ph = Object.entries(state.body.weekly || {}).filter(([, v]) => v && v.photo).map(([n, v]) => ({ n: +n, date: v.date || weekStart(+n), photo: v.photo, weight: v.weight })).sort((a, b) => b.n - a.n);
  const open = ui.photoOpen && ph.find(x => x.photo.id === ui.photoOpen);
  return `<h2 class="sec">Progress photos</h2>
    ${ph.length ? `<div class="gallery">${ph.map(x => `<button class="gph" data-photo="${esc(x.photo.id)}"><img src="${esc(photoSrc(x.photo))}" alt="Week ${x.n}" loading="lazy"><span>Week ${x.n}</span></button>`).join("")}</div>` : `<div class="card empty">Add a photo with your weekly check-in and they’ll collect here.</div>`}
    ${open ? `<div class="lightbox" role="dialog" aria-label="Photo"><button class="lb-bg" data-closephoto="1" aria-label="Close"></button><figure><img src="${esc(photoSrc(open.photo))}" alt=""><figcaption><span>Week ${open.n}, ${esc(fmtShort(open.date))}</span><span>${open.weight != null ? `${open.weight} lb` : ""}</span></figcaption></figure><button class="iconbtn lb-x" data-closephoto="1" aria-label="Close">✕</button></div>` : ""}`;
}

// ---------- Settings ----------
function renderSettings() {
  const st = state.settings, cur = weekOf(today());
  const nextMon = (() => { const t = today(), m = mondayOf(parse(t)); return m === t ? t : addDays(m, 7); })();
  return `<div style="height:8px"></div>
    <h1 class="page-h" style="margin-top:12px">Settings</h1>
    <div class="set-group">
      <span class="lab">rest timer</span>
      <div class="seg wide">
        <button data-restmode="smart" aria-pressed="${st.restMode !== "all90"}">by exercise</button>
        <button data-restmode="all90" aria-pressed="${st.restMode === "all90"}">90 s for all</button>
      </div>
    </div>
    <p class="center" style="margin-top:28px"><button class="linkbtn" id="export">export my data</button></p>`;
}

function lineChart(line, dots, opts = {}) {
  const stacks = dots || (opts.dots ? line : null);
  const avg = dots ? line : null;
  const all = [...(stacks || []), ...(avg || [])];
  if (all.length === 0) return `<div class="empty">Nothing to chart yet.</div>`;
  const COLS = 30, ROWS = 12, W = 340, H = 190, L = 30, R = 8, T = 10, B = 24;
  const xs = all.map(p => parse(p.x).getTime());
  let ys = all.map(p => p.y); if (opts.goal != null) ys.push(opts.goal);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pd = Math.max(1, (y1 - y0) * 0.12); y0 -= pd; y1 += pd;
  const cw = (W - L - R) / (COLS - 1), rh = (H - T - B) / (ROWS - 1);
  const colOf = t => Math.round((t - x0) / (x1 - x0) * (COLS - 1));
  const rowOf = v => Math.round((v - y0) / (y1 - y0) * (ROWS - 1));
  const cx = c => L + c * cw, cy = r => H - B - r * rh;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dot chart">`;
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) svg += `<circle cx="${cx(c).toFixed(1)}" cy="${cy(r).toFixed(1)}" r="2.2" fill="var(--dot)"/>`;
  [0, Math.round((ROWS - 1) / 2), ROWS - 1].forEach(r => { const v = y0 + r / (ROWS - 1) * (y1 - y0); svg += `<text x="${L - 10}" y="${cy(r) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
  if (opts.goal != null) { const gy = cy((opts.goal - y0) / (y1 - y0) * (ROWS - 1)); svg += `<line x1="${L - 4}" x2="${W - R + 4}" y1="${gy}" y2="${gy}" stroke="var(--peri-strong)" stroke-dasharray="2 4" stroke-width="1.5" stroke-linecap="round"/><text x="${W - R}" y="${gy - 6}" text-anchor="end">goal</text>`; }
  if (stacks) {
    const byCol = {};
    stacks.forEach(p => { byCol[colOf(parse(p.x).getTime())] = p; });
    Object.entries(byCol).forEach(([c, p]) => {
      const r = rowOf(p.y), x = cx(+c);
      ["--a3", "--a2", "--a1"].forEach((v, k) => { if (r - k - 1 >= 0) svg += `<circle cx="${x}" cy="${cy(r - k - 1)}" r="2.6" fill="var(${v})"/>`; });
      svg += `<circle cx="${x}" cy="${cy(r)}" r="5.5" fill="var(--a4)" opacity=".16"/><circle cx="${x}" cy="${cy(r)}" r="3.2" fill="var(--a4)"/>`;
    });
  }
  if (avg && avg.length > 1) {
    const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);
    const d = avg.map((p, i) => `${i ? "L" : "M"}${sx(parse(p.x).getTime()).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
    svg += `<path d="${d}" fill="none" stroke="var(--peri-strong)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  svg += `<text x="${L}" y="${H - 4}">${fmtShort(ymd(new Date(x0)))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${fmtShort(ymd(new Date(x1)))}</text>`;
  return svg + `</svg>`;
}
// ---------- Photos ----------
let assetsApi; // undefined = unknown, null = unavailable
(async () => { try { assetsApi = window.claude && window.claude.use ? await claude.use("assets") : null; } catch (e) { assetsApi = null; } if (ui.view === "feeling") render(); })();
function photoSrc(ph) { return ph.data || ph.url || ("/_blob/" + ph.id); }
function shrink(file, max = 1400, q = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("read")); };
    img.src = url;
  });
}
document.addEventListener("change", async ev => {
  if (ev.target.id !== "photoIn" || !ev.target.files[0]) return;
  ui.uploading = true; render();
  try {
    let r;
    if (assetsApi) { r = await assetsApi.upload(await shrink(ev.target.files[0])); }
    else {
      const blob = await shrink(ev.target.files[0], 900, 0.72);
      const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(blob); });
      r = { id: "local-" + Date.now(), data };
      try { localStorage.setItem("liftlog-probe", data); localStorage.removeItem("liftlog-probe"); } catch (e) { toast("Phone storage is full, photo not saved"); ui.uploading = false; render(); return; }
    }
    const n = ui.bodyWeek ?? weekOf(today());
    const W = state.body.weekly;
    W[n] = { ...(W[n] || {}), date: (W[n] && W[n].date) || (n === weekOf(today()) ? today() : weekStart(n)), photo: r.data ? { id: r.id, data: r.data } : { id: r.id, url: r.url } };
    save("body", 0); toast(`Week ${n} photo saved`);
  } catch (e) { toast("Couldn’t upload that photo"); }
  ui.uploading = false; render();
});

// ---------- Timer ----------
function restFor(e) { return state.settings.restMode === "all90" ? 90 : (e.restS || 60); }
let timerInt = null;
function startRest(secs) {
  if (!secs) { ui.timer = null; return; }
  ui.timer = { end: Date.now() + secs * 1000, total: secs, done: false };
}
function tickTimer() {
  clearInterval(timerInt);
  if (!ui.timer || ui.view !== "workout") return;
  const upd = () => {
    const left = restLeft();
    const n = $("#tnum"), ring = $("#ringprog");
    if (n) n.textContent = fmtClock(left);
    if (ring) ring.style.strokeDashoffset = String(100 - (left / ui.timer.total) * 100);
    if (left <= 0 && !ui.timer.done) {
      ui.timer.done = true; clearInterval(timerInt);
      try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
      render();
    }
  };
  upd();
  if (restLeft() > 0) timerInt = setInterval(upd, 250);
}

// ---------- Actions ----------
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }
function sessKey() { return "s:" + sid(today(), curDay()); }
function bestBefore(exId, date) {
  const ws = Object.values(state.sessions).filter(x => x.date < date && x.ex && doneSets(x.ex[exId]).length).map(x => topW(doneSets(x.ex[exId]))).filter(v => v != null);
  return ws.length ? Math.max(...ws) : null;
}
function completeDay() {
  const s = getSession(true, today(), curDay());
  const wasDone = s.complete;
  s.complete = true; s.updated = Date.now();
  save(sessKey(), 0);
  const prs = [];
  let volume = 0;
  if (PROGRAM[s.day]) PROGRAM[s.day].ex.forEach(e => {
    const sets = doneSets(s.ex[e.id]);
    if (e.kind !== "bw" && e.kind !== "time" && e.kind !== "assist") sets.forEach(x => volume += (num(x.w) || 0) * num(x.r));
    const tw = topW(sets), prev = bestBefore(e.id, s.date);
    if (tw != null && prev != null && tw > prev && e.kind !== "assist") prs.push({ n: e.n, w: tw });
  });
  const st = streaks();
  ui.celebrate = { streak: st.cur, best: st.best, prs, volume: Math.round(volume) };
  ui.view = wasDone ? null : "celebrate";
  if (wasDone) toast("Check-in saved");
}
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "feelNote" && ui.feel) { ui.feel.note = t.value; return; }
  if (t.id === "goal") { state.settings.goal = num(t.value); save("profile", 1000); return; }
  if (t.id === "sname") { state.settings.name = t.value.trim(); save("profile", 1000); return; }
  if (t.id === "cmin") { const s = getSession(true, today(), curDay()); s.cardio = { ...(s.cardio || {}), type: $("#ctype").value, min: num(t.value) }; save(sessKey()); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "histEx") { ui.histEx = t.value; render(); }
  if (t.id === "ctype") { const s = getSession(true, today(), curDay()); s.cardio = { ...(s.cardio || {}), type: t.value, min: num($("#cmin").value) }; save(sessKey()); }
  if (t.id === "bweek") { ui.bodyWeek = +t.value; render(); }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.tab) { ui.tab = d.tab; ui.view = null; if (d.tab === "week") { ui.viewWeek = null; ui.weekOpen = null; } if (d.tab === "body") ui.bodyWeek = null; render(); window.scrollTo(0, 0); return; }
  if (d.view) { if (d.view === "settings" && ui.view === "settings") { ui.view = null; render(); window.scrollTo(0, 0); return; } if (d.view === "feeling") ui.feel = null; ui.view = d.view; render(); window.scrollTo(0, 0); return; }
  if (d.closeview) { ui.view = null; render(); return; }
  if (d.swap) { ui.swap = !ui.swap; render(); return; }
  if (d.day) {
    const s = getSession(false, today(), curDay());
    if (state.sessions[sid(today(), curDay())] && !s.complete && setsLogged(s) === 0 && !s.cardio) delete state.sessions[sid(today(), curDay())];
    ui.day = d.day; ui.swap = false; render(); return;
  }
  // workout
  if (d.start) { const p = PROGRAM[curDay()], s = getSession(false), wk = weekOf(today()); const first = p.ex.findIndex(e => doneSets(s.ex[e.id]).length < targetSets(e, wk)); ui.wk = { i: first < 0 ? 0 : first, edit: null, list: false }; ui.view = "workout"; render(); window.scrollTo(0, 0); return; }
  if (d.openex != null) { ui.wk = { i: +d.openex, edit: null, list: false }; ui.timer = null; ui.view = "workout"; render(); window.scrollTo(0, 0); return; }
  if (d.closewk) { ui.view = null; ui.timer = null; render(); window.scrollTo(0, 0); return; }
  if (d.list) { ui.wk.list = !ui.wk.list; render(); return; }
  if (d.goex != null) { ui.wk = { i: +d.goex, edit: null, list: false }; render(); window.scrollTo(0, 0); return; }
  if (d.step) {
    const inp = d.step === "w" ? $("#inW") : $("#inR");
    const v = (num(inp.value) || 0) + Number(d.d);
    inp.value = String(Math.max(0, Math.round(v * 10) / 10)); return;
  }
  if (b.id === "logSet") {
    const p = PROGRAM[curDay()], e = p.ex[ui.wk.i], s = getSession(true);
    const entry = s.ex[e.id] || (s.ex[e.id] = { sets: [], rir: null });
    const r = num($("#inR").value), w = $("#inW") ? num($("#inW").value) : null;
    if (!(r > 0)) { toast(e.kind === "time" ? "Enter your seconds" : "Enter your reps"); return; }
    const idx = ui.wk.edit != null ? ui.wk.edit : entry.sets.filter(x => x && num(x.r) > 0).length;
    entry.sets[idx] = { w, r }; entry.sets = entry.sets.filter(x => x && num(x.r) > 0);
    s.updated = Date.now(); save(sessKey(), 300);
    const wasEdit = ui.wk.edit != null; ui.wk.edit = null;
    if (!wasEdit) startRest(restFor(e));
    render(); return;
  }
  if (d.editset != null) { ui.wk.edit = +d.editset; render(); return; }
  if (d.canceledit) { ui.wk.edit = null; render(); return; }
  if (d.removeset != null) { const e = PROGRAM[curDay()].ex[ui.wk.i], s = getSession(true); s.ex[e.id].sets.splice(+d.removeset, 1); ui.wk.edit = null; save(sessKey()); render(); return; }
  if (d.addrest) { if (ui.timer) ui.timer.end += 15000, ui.timer.total += 15; tickTimer(); return; }
  if (d.skiprest) { ui.timer = null; render(); return; }
  if (d.rir != null && ui.view === "workout") { const e = PROGRAM[curDay()].ex[ui.wk.i], s = getSession(true); const en = s.ex[e.id] || (s.ex[e.id] = { sets: [], rir: null }); const n = +d.rir; en.rir = en.rir === n ? null : n; save(sessKey()); render(); return; }
  if (d.addset) { const e = PROGRAM[curDay()].ex[ui.wk.i], s = getSession(true); const en = s.ex[e.id] || (s.ex[e.id] = { sets: [], rir: null }); ui.wk.edit = en.sets.length; render(); return; }
  if (d.finishwk) { ui.timer = null; ui.feel = null; ui.view = "feeling"; render(); window.scrollTo(0, 0); return; }
  // feeling
  if (d.backfeel) { const s = getSession(false); ui.view = s.complete || !PROGRAM[curDay()] ? null : "workout"; render(); return; }
  if (d.rmwphoto) { const n = ui.bodyWeek ?? weekOf(today()); if (state.body.weekly[n]) { delete state.body.weekly[n].photo; save("body", 0); } render(); return; }
  if (d.photo) { ui.photoOpen = d.photo; render(); return; }
  if (d.closephoto) { ui.photoOpen = null; render(); return; }
  if (d.mood) { ui.feel.mood = +d.mood; render(); return; }
  if (d.tag) { const i = ui.feel.tags.indexOf(d.tag); if (i >= 0) ui.feel.tags.splice(i, 1); else ui.feel.tags.push(d.tag); b.setAttribute("aria-pressed", String(i < 0)); return; }
  if (b.id === "saveFeel") { const s = getSession(true); s.feeling = { mood: ui.feel.mood, tags: ui.feel.tags, note: ($("#feelNote").value || "").trim() }; completeDay(); ui.feel = null; render(); window.scrollTo(0, 0); return; }
  if (d.closecele) { ui.view = null; ui.tab = "today"; render(); window.scrollTo(0, 0); return; }
  if (b.id === "cardioDone") {
    const s = getSession(true); s.cardio = { ...(s.cardio || {}), type: $("#ctype").value, min: num($("#cmin").value) };
    if (s.cardio.type !== "Rest day" && !(s.cardio.min > 0)) { toast("Add your minutes first"); return; }
    save(sessKey()); ui.feel = null; ui.view = "feeling"; render(); window.scrollTo(0, 0); return;
  }
  // week + block
  if (d.wk) { ui.viewWeek = Math.max(1, +d.wk); ui.weekOpen = null; render(); return; }
  if (d.wopen) { ui.weekOpen = ui.weekOpen === d.wopen ? null : d.wopen; render(); return; }
  if (d.wkopen) { ui.viewWeek = +d.wkopen; ui.weekOpen = null; ui.tab = "week"; render(); window.scrollTo(0, 0); return; }
  // body
  if (b.id === "saveWeek") {
    const n = ui.bodyWeek ?? weekOf(today());
    const c = { date: (state.body.weekly[n] && state.body.weekly[n].date) || (n === weekOf(today()) ? today() : weekStart(n)), weight: num($("#bw").value), waist: num($("#cwaist").value), hips: num($("#chips").value), arm: num($("#carm").value), photo: (state.body.weekly[n] || {}).photo };
    if (c.weight == null && c.waist == null && c.hips == null && c.arm == null && !c.photo) { toast("Enter at least one number"); return; }
    state.body.weekly[n] = c; save("body", 0); render(); toast(`Week ${n} saved`); return;
  }
  if (d.restmode) { state.settings.restMode = d.restmode; save("profile", 0); render(); return; }
  if (d.vibe) { state.settings.vibrate = state.settings.vibrate === false; save("profile", 0); render(); return; }
  if (d.newblock === "open") { ui.newBlock = true; render(); return; }
  if (d.newblock === "cancel") { ui.newBlock = false; render(); return; }
  if (d.newblock === "go") {
    const v = $("#nbStart").value; if (!v) { toast("Pick a start date"); return; }
    const start = mondayOf(parse(v));
    const B = state.body;
    if (Object.keys(B.weekly || {}).length) { B.blocks = [...(B.blocks || []), { start: state.settings.startDate, weekly: B.weekly }]; B.weekly = {}; save("body", 0); }
    state.settings.startDate = start; ui.newBlock = false; save("profile", 0);
    render(); toast("New block started"); return;
  }
  if (b.id === "export") { exportData(); return; }
});
async function exportData() {
  const data = JSON.stringify(state, null, 2);
  try {
    const dl = window.claude && window.claude.use ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: `lift-log-${today()}.json`, data }); return; }
    const file = new File([data], `lift-log-${today()}.json`, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Lift Log backup" }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { if (!e || (e.code !== "declined" && e.name !== "AbortError")) toast("Export didn't go through"); }
}

render();
setSync("Saved on this device");
